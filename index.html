<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدّي التحصيلي – كيمياء 1</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-tahsili: #e67e22;
            --accent-tadrib: #2ecc71;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --correct-color: #27ae60;
            --wrong-color: #c0392b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        header h1 {
            color: var(--primary-color);
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        header p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .teacher-badge {
            display: inline-block;
            background: #eddcc8;
            color: #b06d1a;
            padding: 3px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .controls-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .color-key {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .key-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .key-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .dot-tahsili { background-color: var(--accent-tahsili); }
        .dot-tadrib { background-color: var(--accent-tadrib); }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .question-type-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #ccc;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .timer-box {
            font-weight: 700;
            font-size: 16px;
            color: var(--primary-color);
            background: #edf2f7;
            padding: 5px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 25px;
            color: var(--primary-color);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-align: right;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #cbd5e1;
            background: #f1f5f9;
        }

        .option-btn.correct {
            background-color: var(--correct-color) !important;
            border-color: var(--correct-color) !important;
            color: white !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color) !important;
            border-color: var(--wrong-color) !important;
            color: white !important;
        }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            align-items: center;
        }

        .next-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            display: none;
        }

        .score-counter {
            font-size: 14px;
            font-weight: 600;
            color: #7f8c8d;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-tadrib);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }
    </style>
</head>
<body>

    <header>
        <h1>تحدّي التحصيلي – كيمياء 1</h1>
        <p>تدريبات بنمط اختبار التحصيلي من واقع ملف المبادرة</p>
        <span class="teacher-badge">إعداد المعلم: أ. عبدالرحيم سليمان الحجاب</span>
        
        <div class="controls-panel">
            <div class="control-item">
                <span>صوت التشجيع</span>
                <label class="switch">
                    <input type="checkbox" id="sound-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="control-item">
                <span>مؤقت 30 ثانية</span>
                <label class="switch">
                    <input type="checkbox" id="timer-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </header>

    <div class="color-key">
        <div class="key-item">
            <div class="key-dot dot-tahsili"></div>
            <span>تحصيلي (من تجميعات التحصيلي)</span>
        </div>
        <div class="key-item">
            <div class="key-dot dot-tadrib"></div>
            <span>تدريب (سؤال مصمم بالنمط نفسه)</span>
        </div>
    </div>

    <div class="quiz-container">
        <div class="question-type-bar" id="type-bar"></div>
        
        <div class="status-row">
            <span class="badge" id="type-badge">تحصيلي</span>
            <div class="timer-box" id="timer-wrapper">
                ⏱️ <span id="timer-count">30</span> ثانية
            </div>
        </div>

        <div class="question-text" id="question-text">
            جاري تحميل الأسئلة...
        </div>

        <div class="options-grid" id="options-container"></div>

        <div class="footer-controls">
            <div class="score-counter" id="progress-text">السؤال 1</div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي ⬅️</button>
        </div>
    </div>

    <script>
        // جميع أسئلة الفصل الأول المستخرجة من الملف المرفق بدقة
        const quizData = [
            {
                question: "عدد جزيئات الأوزون الناتجة عن 12 ذرة أكسجين:",
                options: ["2", "3", "4", "6"],
                correct: 2, // 4 جزيئات (C)
                type: "tahsili"
            },
            {
                question: "يتكون غاز الأوزون في طبقة:",
                options: ["الميزوسفير", "التروبوسفير", "الثيرموسفير", "الستراتوسفير"],
                correct: 3, // الستراتوسفير (D)
                type: "tahsili"
            },
            {
                question: "أي المواد التالية يسبب نقصاً في طبقة الأوزون؟",
                options: ["ثاني أكسيد الكربون", "أكاسيد الكبريت", "أكاسيد النيتروجين", "الكلوروفلوروكربون CFCs"],
                correct: 3, // الكلوروفلوروكربون (D)
                type: "tahsili"
            },
            {
